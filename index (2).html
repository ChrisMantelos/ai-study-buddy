<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Study Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAFAF6;
    --paper-line: #E4E1D6;
    --ink: #1B2A4A;
    --ink-soft: #4A4A45;
    --highlighter: #FFD23F;
    --correct: #2E7D4F;
    --correct-bg: #E8F5EC;
    --incorrect: #B8442B;
    --incorrect-bg: #FBEAE5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 39px,
        var(--paper-line) 40px
      );
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding: 40px 20px 80px;
  }

  .sheet {
    max-width: 680px;
    margin: 0 auto;
  }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 8px;
  }

  .masthead h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 34px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .masthead .field {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: right;
    line-height: 1.6;
  }

  .field span {
    display: inline-block;
    min-width: 90px;
    border-bottom: 1px solid var(--ink-soft);
  }

  .subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 36px;
  }

  label.section-label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    min-height: 160px;
    padding: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    background: #ffffff;
    border: 2px solid var(--ink);
    border-radius: 2px;
    resize: vertical;
  }

  textarea:focus-visible {
    outline: 3px solid var(--highlighter);
    outline-offset: 2px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .count-select {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  select {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 6px 8px;
    border: 2px solid var(--ink);
    border-radius: 2px;
    background: #fff;
    color: var(--ink);
  }

  select:focus-visible { outline: 3px solid var(--highlighter); outline-offset: 2px; }

  button.generate {
    position: relative;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--ink);
    border-radius: 2px;
    padding: 12px 22px;
    cursor: pointer;
    z-index: 0;
    overflow: hidden;
    transition: color 0.25s ease;
  }

  button.generate::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--highlighter);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s ease;
    z-index: -1;
  }

  button.generate:hover::before,
  button.generate:focus-visible::before {
    transform: scaleX(1);
  }

  button.generate:disabled {
    opacity: 0.5;
    cursor: default;
  }

  button.generate:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .error-banner {
    margin-top: 18px;
    padding: 12px 14px;
    border-left: 4px solid var(--incorrect);
    background: var(--incorrect-bg);
    color: var(--incorrect);
    font-size: 14px;
    font-family: 'IBM Plex Mono', monospace;
    display: none;
  }

  .quiz {
    margin-top: 44px;
    display: none;
  }

  .example {
    margin-top: 44px;
    padding-top: 24px;
    border-top: 1px dashed var(--paper-line);
    opacity: 0.55;
  }

  .example .q-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .example .bubble::before { display: none; }
  .example .option { cursor: default; }

  .question-block {
    border-top: 1px solid var(--paper-line);
    padding: 28px 0;
  }

  .question-block:first-child { border-top: none; }

  .q-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .q-text {
    font-family: 'Source Serif 4', serif;
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 18px;
    line-height: 1.4;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    padding: 6px 4px;
    border-radius: 4px;
  }

  .option:focus-visible { outline: 3px solid var(--highlighter); outline-offset: 2px; }

  .bubble {
    position: relative;
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border-radius: 48% 52% 51% 49% / 53% 47% 53% 47%;
    border: 2px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    background: #fff;
    overflow: hidden;
  }

  .option:nth-of-type(2) .bubble { border-radius: 51% 49% 47% 53% / 49% 51% 49% 51%; }
  .option:nth-of-type(3) .bubble { border-radius: 47% 53% 52% 48% / 52% 48% 51% 49%; }
  .option:nth-of-type(4) .bubble { border-radius: 52% 48% 49% 51% / 48% 53% 47% 52%; }

  .bubble::before {
    content: "";
    position: absolute;
    inset: -10%;
    border-radius: inherit;
    background:
      repeating-conic-gradient(
        from 20deg,
        currentColor 0deg 3deg,
        transparent 3deg 14deg
      );
    transform: scale(0);
    opacity: 0;
    transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s ease;
  }

  .option.selected .bubble { color: var(--ink); }
  .option.selected .bubble::before { transform: scale(1) rotate(8deg); opacity: 1; }

  .option.correct .bubble {
    border-color: var(--correct);
    color: var(--correct);
  }
  .option.correct .bubble::before { transform: scale(1) rotate(-6deg); opacity: 1; }

  .option.incorrect .bubble {
    border-color: var(--incorrect);
    color: var(--incorrect);
  }
  .option.incorrect .bubble::before { transform: scale(1) rotate(10deg); opacity: 1; }

  .bubble .letter {
    position: relative;
    z-index: 1;
    transition: opacity 0.15s ease;
  }

  .option.selected .bubble .letter,
  .option.correct .bubble .letter,
  .option.incorrect .bubble .letter {
    opacity: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .bubble::before { transition: opacity 0.15s ease; }
  }

  .option-text { font-size: 15px; }

  .option.locked { cursor: default; }

  .explanation {
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--correct-bg);
    border-left: 4px solid var(--correct);
    font-size: 13.5px;
    color: var(--ink-soft);
    display: none;
  }

  .score-line {
    margin-top: 8px;
    padding-top: 24px;
    border-top: 3px solid var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    display: none;
  }

  .score-line .big {
    font-family: 'Source Serif 4', serif;
    font-size: 40px;
    font-weight: 700;
    display: block;
    margin-bottom: 4px;
  }

  .loading-row {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .pencil {
    width: 16px;
    height: 16px;
    border: 2px solid var(--ink-soft);
    border-radius: 50%;
    border-top-color: transparent;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    button.generate::before { transition: none; }
    .pencil { animation: none; }
  }

  @media (max-width: 480px) {
    body { padding: 24px 14px 60px; }
    .masthead { flex-direction: column; align-items: flex-start; gap: 10px; }
    .masthead h1 { font-size: 27px; }
    .masthead .field { text-align: left; }
    .q-text { font-size: 17px; }
    .controls { flex-direction: column; align-items: stretch; }
    button.generate { width: 100%; padding: 14px 22px; }
    .option { padding: 10px 4px; }
    .option-text { font-size: 14.5px; }
    .score-line .big { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="masthead">
    <h1>Study Buddy</h1>
    <div class="field">Backend <span id="backendLabel">127.0.0.1:8000</span></div>
  </div>
  <p class="subtitle">Paste your notes below. Fill in the answer sheet that comes back.</p>

  <label class="section-label" for="notes">Notes</label>
  <textarea id="notes" placeholder="Paste study notes here..."></textarea>

  <div class="controls">
    <div class="count-select">
      <label for="numQuestions">Questions</label>
      <select id="numQuestions">
        <option value="3">3</option>
        <option value="5" selected>5</option>
        <option value="7">7</option>
        <option value="10">10</option>
      </select>
    </div>
    <button class="generate" id="generateBtn">Generate quiz</button>
  </div>

  <div class="loading-row" id="loadingRow">
    <div class="pencil"></div>
    <span>Reading your notes...</span>
  </div>

  <div class="error-banner" id="errorBanner"></div>

  <div class="example" id="exampleBlock">
    <div class="q-number">Example — this is what comes back</div>
    <p class="q-text">Which organelle is described as the site of cellular respiration?</p>
    <div class="options">
      <div class="option"><div class="bubble"><span class="letter">A</span></div><span class="option-text">Ribosome</span></div>
      <div class="option"><div class="bubble"><span class="letter">B</span></div><span class="option-text">Mitochondria</span></div>
      <div class="option"><div class="bubble"><span class="letter">C</span></div><span class="option-text">Golgi apparatus</span></div>
    </div>
  </div>

  <div class="quiz" id="quiz"></div>
</div>

<script>
  const BACKEND_URL = 'http://127.0.0.1:8000';
  document.getElementById('backendLabel').textContent = BACKEND_URL.replace('http://', '');

  const notesEl = document.getElementById('notes');
  const numQuestionsEl = document.getElementById('numQuestions');
  const generateBtn = document.getElementById('generateBtn');
  const loadingRow = document.getElementById('loadingRow');
  const errorBanner = document.getElementById('errorBanner');
  const quizEl = document.getElementById('quiz');

  let currentQuestions = [];
  let score = 0;
  let answeredCount = 0;

  function showError(message) {
    errorBanner.textContent = message;
    errorBanner.style.display = 'block';
  }

  function clearError() {
    errorBanner.style.display = 'none';
    errorBanner.textContent = '';
  }

  async function generateQuiz() {
    const notes = notesEl.value.trim();
    if (!notes) {
      showError('Paste some notes first.');
      return;
    }

    clearError();
    quizEl.style.display = 'none';
    quizEl.innerHTML = '';
    score = 0;
    answeredCount = 0;
    generateBtn.disabled = true;
    loadingRow.style.display = 'flex';

    try {
      const response = await fetch(`${BACKEND_URL}/generate-quiz`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          notes: notes,
          num_questions: parseInt(numQuestionsEl.value, 10),
        }),
      });

      const data = await response.json();

      if (!response.ok) {
        showError(data.detail ? String(data.detail) : 'The server returned an error.');
        return;
      }

      currentQuestions = data.questions;
      document.getElementById('exampleBlock').style.display = 'none';
      renderQuiz(currentQuestions);
    } catch (err) {
      showError('Could not reach the backend. Is it running at ' + BACKEND_URL + '?');
    } finally {
      generateBtn.disabled = false;
      loadingRow.style.display = 'none';
    }
  }

  function renderQuiz(questions) {
    quizEl.innerHTML = '';

    questions.forEach((q, qIndex) => {
      const block = document.createElement('div');
      block.className = 'question-block';

      const number = document.createElement('div');
      number.className = 'q-number';
      number.textContent = `Question ${qIndex + 1} of ${questions.length}`;
      block.appendChild(number);

      const text = document.createElement('p');
      text.className = 'q-text';
      text.textContent = q.question;
      block.appendChild(text);

      const optionsWrap = document.createElement('div');
      optionsWrap.className = 'options';

      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

      q.options.forEach((optionText, oIndex) => {
        const option = document.createElement('div');
        option.className = 'option';
        option.tabIndex = 0;
        option.setAttribute('role', 'button');

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const letterSpan = document.createElement('span');
        letterSpan.className = 'letter';
        letterSpan.textContent = letters[oIndex] || String(oIndex + 1);
        bubble.appendChild(letterSpan);

        const label = document.createElement('span');
        label.className = 'option-text';
        label.textContent = optionText;

        option.appendChild(bubble);
        option.appendChild(label);

        const select = () => {
          if (option.classList.contains('locked')) return;

          const allOptions = optionsWrap.querySelectorAll('.option');
          allOptions.forEach((el) => el.classList.add('locked'));

          option.classList.add('selected');

          if (oIndex === q.correct_index) {
            option.classList.add('correct');
            score += 1;
          } else {
            option.classList.add('incorrect');
            const correctEl = allOptions[q.correct_index];
            if (correctEl) correctEl.classList.add('correct');
          }

          answeredCount += 1;

          const explanation = block.querySelector('.explanation');
          explanation.style.display = 'block';

          if (answeredCount === questions.length) {
            showScore(questions.length);
          }
        };

        option.addEventListener('click', select);
        option.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            select();
          }
        });

        optionsWrap.appendChild(option);
      });

      block.appendChild(optionsWrap);

      const explanation = document.createElement('div');
      explanation.className = 'explanation';
      explanation.textContent = q.explanation;
      block.appendChild(explanation);

      quizEl.appendChild(block);
    });

    const scoreLine = document.createElement('div');
    scoreLine.className = 'score-line';
    scoreLine.id = 'scoreLine';
    quizEl.appendChild(scoreLine);

    quizEl.style.display = 'block';
  }

  function showScore(total) {
    const scoreLine = document.getElementById('scoreLine');
    scoreLine.innerHTML = `<span class="big">${score} / ${total}</span>Quiz complete.`;
    scoreLine.style.display = 'block';
  }

  generateBtn.addEventListener('click', generateQuiz);
</script>

</body>
</html>
